[package]
name = "abstract-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "abstract-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ironrdp = { workspace = true, features = ["client", "connector", "cliprdr"] }
ironrdp-client.workspace = true
smallvec = "1.15"
softbuffer = "0.4.8"
tokio.workspace = true
url = "2"
winit = "0.30.13"

