name: Build the flutter version of Desk0

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "nightly"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.97.0"
  LLVM_VERSION: "23.1.2"
  FLUTTER_VERSION: "3.47.2"
  TAG_NAME: "${{ inputs.upload-tag }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for_windows-flutter:
    name: Flutter Windows (${{ matrix.job.target }}) (Unsigned)
    needs: [generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
            }
          - {
              target: aarch64-pc-windows-msvc,
              os: windows-11-arm,
              arch: aarch64,
              flutter-arch: arm64,
            }
    steps:
      - name: Export Github actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: "bridge-artifact"
          path: ./

      - name: Install LLVM and clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.job.flutter-arch }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: viewer

      - name: Build Flutter Windows (.exe) (Unsigned)
        run: flutter build windows --release
        working-directory: viewer

      - name: Package Windows build (.exe) (Unsigned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $releasePath = Get-ChildItem -Path "viewer/build/windows" -Recurse -Filter "desk0.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($releasePath) {
            Copy-Item -Path "$releasePath\*" -Destination "dist" -Recurse
            Copy-Item -Path "$releasePath\desk0.exe" -Destination "desk0-windows-${{ matrix.job.arch }}-unsigned.exe"
          } else {
            Write-Error "desk0.exe not found in build directory"
          }

      - name: Upload Windows Artifact (Unsigned)
        if: ${{ inputs.upload-artifact == true || inputs.upload-artifact == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: desk0-flutter-windows-${{ matrix.job.arch }}-unsigned
          path: |
            desk0-windows-${{ matrix.job.arch }}-unsigned.exe
            dist/

  build-for-macOs:
    name: Flutter macOS (${{ matrix.job.target }}) (Unsigned)
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-apple-darwin, os: macos-15-intel, arch: x86_64 }
          - { target: aarch64-apple-darwin, os: macos-14, arch: aarch64 }

    steps:
      - name: Export Github actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg nasm libpq
          if command -v pkg-config &>/dev/null; then
            echo "pkg-config is already installed"
          else
            brew install pkg-config
          fi

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: "bridge-artifact"
          path: ./

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: viewer

      - name: Build Flutter macOS (Unsigned)
        run: flutter build macos --release --no-codesign
        working-directory: viewer

      - name: Package macOS DMG (Unsigned)
        run: |
          APP_PATH=$(find viewer/build/macos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          DMG_NAME="desk0-flutter-macos-${{ matrix.job.arch }}-unsigned.dmg"
          create-dmg \
            --volname "Desk0" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "$APP_PATH" || \
          hdiutil create -volname "Desk0" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"

      - name: Upload macOS Artifact (Unsigned)
        if: ${{ inputs.upload-artifact == true || inputs.upload-artifact == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: desk0-flutter-macos-${{ matrix.job.arch }}-unsigned
          path: desk0-flutter-macos-${{ matrix.job.arch }}-unsigned.dmg
