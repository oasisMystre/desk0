name: Build flutter-rust-bridge

on:
  workflow_call:

env:
  RUST_VERSION: "1.97.0"
  CARGO_EXPAND_VERSION: "1.0.126"
  FLUTTER_RUST_BRIDGE_VERSION: "2.13.0"
  PACKAGES_LINUX:
    "ca-certificates clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm \
    ninja-build pkg-config wget libasound2-dev libdbus-1-dev libjack-jackd2-dev libpipewire-0.3-dev"

jobs:
  generage_bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: true
      matrix:
        job:
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-24.04,
              flutter-version: "3.47.2",
              artifact-name: "bridge-artifact",
            }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ${{ env.PACKAGES_LINUX }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.flutter-version }}
          cache: true

      - name: Install Rust CLI tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand@${{ env.CARGO_EXPAND_VERSION }}, flutter_rust_bridge_codegen@${{ env.FLUTTER_RUST_BRIDGE_VERSION }}

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            viewer/.dart_tool
          key: flutter-pub-${{ runner.os }}-${{ matrix.job.flutter-version }}-${{ hashFiles('viewer/pubspec.lock', 'viewer/pubspec.yaml') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-${{ matrix.job.flutter-version }}-

      - name: Install flutter dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: viewer

      - name: Run flutter rust bridge
        run: |
          flutter_rust_bridge_codegen generate
          cp ./viewer/macos/Runner/bridge_generated.h ./viewer/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job.artifact-name }}
          path: |
            ./viewer/lib/ffi
            ./bins/ffi/src/frb_generated.rs
