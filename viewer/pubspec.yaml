name: desk0
description: "Desk0 is a remote desktop manager."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  multiview_desktop: ^1.2.2
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  flutter_custom_cursor: ^0.0.4
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  rust_lib_desk0:
    path: rust_builder
  irondash_engine_context: ^0.5.5
  terminal_view: ^0.4.0
  app_links: ^7.2.2
  msix: ^3.18.0

dev_dependencies:
  freezed: ^3.1.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  ffigen: ^8.0.0

  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: MonaSans
      fonts:
        - asset: assets/fonts/MonaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MonaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MonaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MonaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
  linux:
    generate: true
  macos:
    generate: true

msix_config:
  display_name: Desk0
  msix_version: 1.0.0.0
  protocol_activation: https, desk0
  app_uri_handler_hosts: app.desk0.xyz
