[package]
name = "desk0"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
enigo = "0.3.0"
clap = { version = "4.6.6", features = ["derive"] }


ironrdp = { version = "0.17.0", features = ["connector", "session", "acceptor", "server"] }
ironrdp-rdpsnd = "0.9.0"
ironrdp-tokio = "0.10.0"
rcgen = "0.14.9"
rust-i18n = "4.2.1"
rustls = "0.23.43"
rustls-pki-types = "1.15.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-utils = "0.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
bytemuck = "1.25.2"
rs_capture = { path = "../../notmine/rs-capture", features = ["metadata"] }
display-info = "0.5.9"
tokio-util = "0.7.19"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Globalization",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-service = "0.8.1"
dxgi-capture-rs = "1.2.2"
