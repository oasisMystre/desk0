[workspace]
resolver = "3"
members = ["bins/*", "crates/*"]

[profile.dev]
debug = 1
strip = "debuginfo"
opt-level = 1
panic = "abort"

[workspace.dependencies]
rs_capture = { path = "../../notmine/rs-capture", features = ["metadata"] }
desk0-protocol = { path = "crates/desk0-protocol" }

anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

tokio-stream = "0.1"
tokio-util = { version = "0.7.19", features = ["full", "codec", "io"] }
tokio-rustls = "0.26.4"
tokio = { version = "1.53.1", features = ["full"] }
