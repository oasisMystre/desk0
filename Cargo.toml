[workspace]
resolver = "3"
members = ["bins/*", "crates/*"]

[profile.dev]
debug = 1
strip = "debuginfo"
opt-level = 1
panic = "abort"

[workspace.dependencies]
pdu = { path = "crates/pdu" }
ipc = { path = "crates/ipc" }
flow = { path = "crates/flow" }
audio = { path = "crates/audio" }
shared = { path = "crates/shared" }
ipc-pdu = { path = "crates/ipc-pdu" }
copypaste = { path = "crates/copypaste" }

jwt = "0.16.0"
sha2 = "0.10.0"
rand = "0.10.3"
strum = "0.27"
clap = "4.6.6"
serde = "1.0"
uuid = "1.10"
axum = "0.8.9"
base64 = "0.23.1"
hmac = "0.12.0"
cpal = "0.18.2"
rkyv = "0.8.18"
futures = "0.3"
bytes = "1.12.1"
pinray = "0.2.7"
anyhow = "1.0.104"
dotenvy = "0.15.7"
tracing = "0.1.44"
serde_json = "1.0"
thiserror = "2.0.21"
async-trait = "0.1.92"
display-info = "0.5.9"
deadpool-redis = "0.23.1"
diesel-async = "0.9.2"
ed25519-dalek = "=3.0.0-rc.1"

# ironrdp
ironrdp = { git = "https://github.com/Devolutions/IronRDP.git" }
ironrdp-rdcleanpath = { git = "https://github.com/Devolutions/IronRDP.git" }
ironrdp-cliprdr-format = { git = "https://github.com/Devolutions/IronRDP.git" }

tonic = "0.12"
tokio = "1.53.1"
tokio-stream = "0.1"
tokio-util = "0.7.19"
tokio-rustls = "0.26.4"
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"
utoipa-swagger-ui = "10.0.2"
