[workspace]
resolver = "3"
members = ["bins/*", "crates/*"]

[profile.dev]
debug = 1
strip = "debuginfo"
opt-level = 1
panic = "abort"

[workspace.dependencies]
pdu = { path = "crates/pdu" }
ipc = { path = "crates/ipc" }
flow = { path = "crates/flow" }
audio = { path = "crates/audio" }
shared = { path = "crates/shared" }
ipc-pdu = { path = "crates/ipc-pdu" }
copypaste = { path = "crates/copypaste" }
rs_capture = { path = "../../notmine/rs-capture", features = ["metadata"] }

jwt = "0.16.0"
sha2 = "0.10.0"
hmac = "0.12.0"
cpal = "0.18.2"
rkyv = "0.8.18"
futures = "0.3"
bytes = "1.12.1"
pinray = "0.2.7"
anyhow = "1.0.104"
dotenvy = "0.15.7"
tracing = "0.1.44"
serde_json = "1.0"
thiserror = "2.0.21"
async-trait = "0.1.92"
display-info = "0.5.9"
strum = { version = "0.27", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

deadpool-redis = "0.23.1"
diesel-async = { version = "0.9.2", features = ["postgres"] }

# ironrdp
ironrdp = { git = "https://github.com/Devolutions/IronRDP.git" }
ironrdp-rdcleanpath = { git = "https://github.com/Devolutions/IronRDP.git" }
ironrdp-cliprdr-format = { git = "https://github.com/Devolutions/IronRDP.git" }

tokio-stream = "0.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", features = ["ring"] }
tokio-util = { version = "0.7.19", features = ["full", "codec", "io"] }
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport"] }

tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
