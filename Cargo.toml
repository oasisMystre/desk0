[workspace]
resolver = "3"
members = ["bins/*", "crates/*"]

[profile.dev]
debug = 1
strip = "debuginfo"
opt-level = 1
panic = "abort"

[workspace.dependencies]
flow = { path = "crates/flow" }
pdu = { path = "crates/pdu" }
shared = { path = "crates/shared" }
copypaste = { path = "crates/copypaste" }
rs_capture = { path = "../../notmine/rs-capture", features = ["metadata"] }

jwt = "0.16.0"
sha2 = "0.10.0"
hmac = "0.12.0"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
dotenvy = "0.15.7"
async-trait = "0.1.92"
bytes = "1.12.1"
deadpool-redis = "0.23.1"
strum = { version = "0.27", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
diesel-async = { version = "0.9.2", features = ["postgres"] }
ironrdp-rdcleanpath = { git = "https://github.com/Devolutions/IronRDP.git" }
ironrdp-cliprdr-format = { git = "https://github.com/Devolutions/IronRDP.git" }
ironrdp = { git = "https://github.com/Devolutions/IronRDP.git" }

tokio-stream = "0.1"
tokio-util = { version = "0.7.19", features = ["full", "codec", "io"] }
tokio-rustls = { version = "0.26.4", features = ["ring"] }
tokio = { version = "1.53.1", features = ["full"] }
