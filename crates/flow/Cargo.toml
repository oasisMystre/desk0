[package]
name = "flow"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features  = ["serde"] }
diesel = { version = "2.3.12", features = ["postgres", "chrono", "uuid", "serde_json"] }
uuid = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json.workspace = true
