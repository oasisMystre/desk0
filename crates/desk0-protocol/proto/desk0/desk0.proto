syntax = "proto3";

package desk0;

service Desk0HubService {
  // Bidirectional control channel between Agent and Server
  rpc ConnectTunnel(stream ConnectTunnelRequest) returns (stream ConnectTunnelResponse);

  // Bidirectional streaming channel for tunneling raw RDP bytes for a given session
  rpc RelayStream(stream RelayData) returns (stream RelayData);
}

message AgentRegister {
  string org_id = 1;
  string device_id = 2;
  string os = 3;
  string version = 4;
  optional string username = 5;
  optional string hostname = 6;
}

message Heartbeat {
  string device_id = 1;
}

message SessionStatus {
  string session_id = 1;
  bool ready = 2;
  bool closed = 3;
}

message ConnectTunnelRequest {
  oneof msg {
    AgentRegister register = 1;
    Heartbeat heartbeat = 2;
    SessionStatus session_status = 3;
  }
}

message RegisterAckSuccess {
  string session_token = 2;
}

message RegisterAckError {
  string error = 3;
}

message RegisterAck {
  oneof ack {
    RegisterAckSuccess success = 1;
    RegisterAckError error = 2;
  }
}

message HeartbeatAck {}

message StartSession {
  string session_id = 1;
}

message CloseSession {
  string session_id = 1;
}

message ConnectTunnelResponse {
  oneof msg {
    RegisterAck register_ack = 1;
    HeartbeatAck heartbeat_ack = 2;
    StartSession start_session = 3;
    CloseSession close_session = 4;
  }
}

message RelayData {
  bool is_init = 1;
  string org_id = 2;
  string device_id = 3;
  string session_id = 4;
  bytes data = 5;
}
