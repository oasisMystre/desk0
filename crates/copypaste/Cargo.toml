[package]
name = "copypaste"
version = "0.1.0"
edition = "2024"

[features]
server = ["ironrdp/server"]
client = ["ironrdp/client", "ironrdp/client-clipboard"]

[dependencies]
image = "0.25.10"
clipboard-rs = "0.3.5"
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
ironrdp = { workspace = true, features = ["cliprdr"] }
ironrdp-cliprdr-format = "0.2.0"
tracing-subscriber.workspace = true