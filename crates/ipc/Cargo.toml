[package]
name = "ipc"
version = "0.1.0"
edition = "2024"

[features]

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "io-util"] }

rkyv = "0.8.18"
shared_memory = "0.12.4"
interprocess = { version = "2.4.5", features = ["tokio"] }


[dev-dependencies] 
ipc-pdu.workspace = true