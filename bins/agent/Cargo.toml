[package]
name = "desk0-agent"
version = "0.1.0"
edition = "2024"

[features]
io = []
audio = []
video = []
terminal = []

[dependencies]
pdu.workspace = true
shared = { workspace = true, features = ["otel"] }
audio = {workspace = true, features = ["convert"] }
copypaste = { workspace = true, features = ["server"] }

uuid.workspace = true
cpal.workspace = true
clap.workspace = true
serde.workspace = true
tokio.workspace = true
bytes.workspace = true
anyhow.workspace = true
futures.workspace = true
tracing.workspace = true
thiserror.workspace = true 
serde_json.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
display-info.workspace = true
tokio-rustls.workspace = true
ironrdp = { workspace = true, features = ["acceptor", "server", "cliprdr", "svc", "rdpsnd", "displaycontrol"] }

rfd = "0.17.2"
enigo = "0.6.1"
pinray = "0.2.6"
rcgen = "0.14.10"
rustls = "0.23.45"
rust-i18n = "4.2.1"
sys-locale = "0.3.2"
portable-pty = "0.9.0"
tokio-tungstenite = "0.30.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8.1"
