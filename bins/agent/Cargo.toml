[package]
name = "desk0-agent"
version = "0.1.0"
edition = "2024"

[features]
io = []
audio = []
video = []
default = []
terminal = []
ipc = ["copypaste/ipc"]
file-logs = ["shared/file-logs"]

[dependencies]
# Internal crates
pdu.workspace = true
ipc.workspace = true
ipc-pdu.workspace = true
shared = { workspace = true, features = ["otel"] }
audio = { workspace = true, features = ["convert"] }
copypaste = { workspace = true, features = ["server"] }

cpal.workspace = true
bytes.workspace = true
base64.workspace = true 
pinray.workspace = true
anyhow.workspace = true
futures.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
display-info.workspace = true
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4", "serde"] }
tokio-rustls = { workspace = true, features = ["ring"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] } 
ironrdp = { workspace = true, features = [
    "acceptor",
    "server",
    "cliprdr",
    "svc",
    "rdpsnd",
    "displaycontrol",
] }

rfd = "0.17.2"
enigo = "0.6.1"
rand = "0.10.3"
keyring = "4.2.0"
rcgen = "0.14.10"
rustls = "0.23.45"
rust-i18n = "4.2.1"
rand_core = "0.10.1"
sys-locale = "0.3.2"
portable-pty = "0.9.0"
tokio-tungstenite = "0.30.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.8.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
