[package]
name = "desk0-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
ffi = []
bin = ["dep:winit", "dep:smallvec", "dep:softbuffer"]
default = ["bin"]

[dependencies]
# internal crates 
pdu.workspace = true
audio.workspace = true
shared = { workspace = true, features=["otel"] }
copypaste = { workspace = true, features=["client"] }

cpal.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
display-info.workspace = true 
ironrdp = { workspace = true, features = ["client", "rustls", "cliprdr", "input", "session", "rdpsnd"] }

url = "2"
whoami = "2.1.3"
semver = "1.0.28"

ringbuf = "0.5.3"
winit = { version="0.30.13", optional = true }
smallvec = { version="1.15", optional = true }
softbuffer = { version="0.4.8", optional = true }
