[package]
name = "desk0-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
ffi = []

[dependencies]
pdu.workspace = true
shared = { workspace = true, features=["otel"] }
copypaste = { workspace = true, features=["client"] }
anyhow.workspace = true
ironrdp = { workspace = true, features = ["client", "rustls", "cliprdr", "input", "session"] }
tokio.workspace = true
smallvec = "1.15"
softbuffer = "0.4.8"
tracing.workspace = true
winit = "0.30.13"
url = "2"
display-info = "0.5.9"
clap.workspace = true
thiserror = "2.0.20"
whoami = "2.1.3"
semver = "1.0.28"
tokio-util.workspace = true
