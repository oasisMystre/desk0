[package]
name = "desk0-server"
version = "0.1.0"
edition = "2024"

[features]
otel = []
sentinel = ["deadpool-redis/sentinel"]
opentelemetry = [
    "otel",
    "tracing-subscriber/json",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-prometheus",
    "dep:opentelemetry-appender-tracing"
]
default = ["otel"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
uuid.workspace = true
deadpool-redis = "0.23.1"
desk0-protocol.workspace = true
diesel-async = { version = "0.9.2", features = ["postgres", "bb8"] }
dotenvy = "0.15.7"
futures.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
strum = { version = "0.27", features = ["derive"] }
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing-log = "0.2.0"
tracing-error = "0.2.1"
tracing-throttle = "0.4.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Optional OpenTelemetry / Tracing dependencies
opentelemetry = { version = "0.31.0", optional = true }
tracing-opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-prometheus = { version = "0.31.0", optional = true }
opentelemetry-appender-tracing = { version = "0.31.1", optional = true }
opentelemetry_sdk = { version = "0.31.0", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-otlp = { version = "0.31.1", features = ["metrics", "grpc-tonic"], optional = true }
dashmap = "6.2.1"
tracing = "0.1.44"
