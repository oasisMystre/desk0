[package]
name = "desk0-server"
version = "0.1.0"
edition = "2024"

[features]
otel = []
opentelemetry = ["shared/opentelemetry"]
default = ["otel"]

[dependencies]
strum.workspace = true
flow.workspace = true
shared =  { workspace = true,  features=["postgres", "redis", "otel"]}
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
tokio.workspace = true

dashmap = "6.2.1"

jwt.workspace = true
sha2.workspace = true
hmac.workspace = true
tracing.workspace = true
tokio-tungstenite = "0.30.0"
serde_json.workspace = true
ironrdp-rdcleanpath = "0.2.2"
rcgen = "0.14.10"


axum =  { version = "0.8.9", features = ["ws"] }
diesel-async.workspace = true
serde.workspace = true
uuid.workspace = true
diesel = "2.3.12"
aws-sdk-s3 = "1.144.0"
aws-config = "1.11.0"
chrono = "0.4.45"
axum-extra = { version="0.12.6", features=["typed-header"] }
tower-http = { version="0.7.1", features=["trace"]}
