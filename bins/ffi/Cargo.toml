[package]
name = "desk0-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_lib_desk0"
crate-type = ["cdylib", "staticlib"]

[features]
flutter = []
default = ["flutter"]

[dependencies]
winit = "0.30.13"
tracing.workspace = true
shared = { workspace = true, features=["otel"] }
copypaste = { workspace = true }
desk0-client = { path = "../client" }
anyhow.workspace = true
ironrdp = { workspace = true, features = ["client", "connector", "cliprdr", "input", "session", "client-clipboard", "graphics"] }
flutter_rust_bridge = "=2.13.0"
