[package]
name = "desk0-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_lib_desk0"
crate-type = ["cdylib", "staticlib"]

[dependencies]
pdu.workspace = true
shared = { workspace = true, features=["otel"] }
desk0-client = { path = "../client", features=["ffi"] }

anyhow.workspace = true
tracing.workspace = true
copypaste = { workspace = true }
tokio = {workspace = true, features=["sync"]}
ironrdp = { workspace = true, features = ["client", "connector", "cliprdr", "input", "session", "client-clipboard", "graphics"] }

winit = "0.30.13"
irondash_texture = "0.5.0"
flutter_rust_bridge = "=2.13.0"
rayon = "1.12.0"
