services:
  server:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./bins/server/Dockerfile
    restart: unless-stopped
    networks:
      - desk0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  buildx:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./workers/buildx/Dockerfile
    restart: unless-stopped
    networks:
      - desk0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8.8.2
    restart: unless-stopped
    networks:
      - desk0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres:
    image: koehn/postgres-wal-g:18.6-v3.0.9
    restart: unless-stopped
    networks:
      - desk0
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_timeout=60"
      - "-c"
      - "archive_command=wal -g wal-push %p"
    environment:
      - POSTGRES_DB=desk0
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=desk0
      - AWS_ENDPOINT=${S3_ENDPOINT}
      - AWS_REGION=${S3_REGION}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_ACCESS_KEY}
      - WALG_COMPRESSION_METHOD=lz4
      - WALG_S3_PREFIX=s3://${S3_BUCKET_POSTGRES}/wal-g
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rhiva"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  workbench:
    image: ghcr.io/pontusab/workbench-standalone:latest
    networks:
      - desk0
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL}
      - QUEUE_NAMES=${QUEUE_NAMES:-desk0}

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    networks:
      - desk0
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_ACCESS_TOKEN}

caddy:
  image: caddy:2
  container_name: caddy
  restart: unless-stopped
  ports:
    - "80:80"
    - "443:443"
  networks:
    - desk0
  volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config

volumes:
  redis_data:
  postgres_data:
    caddy_data:
    caddy_config:

networks:
  desk0:
